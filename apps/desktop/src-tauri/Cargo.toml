[package]
name = "desktop-pet"
version = "0.0.0"
description = "Windows desktop pet M0 probe"
edition = "2021"

[lib]
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
wiremock = "=0.6.2"

[dependencies]
base64 = "=0.22.1"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.12.22", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
thiserror = "=2.0.19"
tokio = { version = "=1.47.2", features = ["time"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }
