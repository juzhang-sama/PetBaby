<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面宠物设置</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="settings-shell">
    <h1>桌面宠物设置</h1>
    <div class="tabs">
      <button id="tab-list" class="tab active">我的宠物</button>
      <button id="tab-create" class="tab">创建宠物</button>
    </div>

    <div id="view-list">
      <div class="pet-list" id="list"></div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div id="view-create" style="display:none">
      <div class="wizard">
        <h2 id="wizard-title">创建新宠物</h2>
        <div id="wizard-status" class="wizard-status"></div>
        <div class="wizard-step">
          <label>生成 API Key（lk888.ai）：<input type="password" id="api-key" placeholder="sk-..." style="width:280px" /></label>
          <button id="save-key">保存 Key</button>
          <div id="key-status" style="font-size:12px;color:#666"></div>
        </div>
        <div class="wizard-step" id="wizard-step">
          <div id="step-upload">
            <label>种类：
              <select id="w-species">
                <option value="cat">猫</option>
                <option value="dog">狗</option>
              </select>
            </label>
            <div><input type="file" id="photo-input" accept="image/*" /></div>
            <img id="photo-preview" alt="预览" />
            <div class="privacy-note">
              隐私提示：照片将上传到第三方生成平台（gpt-image-2）用于生成卡通形象，
              平台侧生成结果默认保留；本地仅保存你的宠物资产。取消可随时进行。
            </div>
          </div>
          <div id="step-generating" style="display:none">
            <p>正在生成候选（约 1-2 分钟）…</p>
            <div class="job-grid" id="job-grid"></div>
          </div>
          <div id="step-review" style="display:none">
            <p>生成完成，看看效果：</p>
            <div class="candidate-grid" id="candidate-grid"></div>
            <div class="wizard-actions" id="review-actions" style="display:none">
              <button id="review-accept" class="primary">满意，出现在桌面</button>
              <button id="review-retry">不满意，重新生成</button>
              <button id="review-abandon">放弃</button>
            </div>
          </div>
          <div id="step-confirm" style="display:none">
            <p>资产已准备，正在设为当前桌面宠物。</p>
            <div class="wizard-actions">
              <button id="confirm-retry" class="primary">重试设为当前宠物</button>
            </div>
          </div>
          <div id="step-complete" style="display:none">
            <p>宠物已出现在桌面。</p>
          </div>
        </div>
        <div class="wizard-actions">
          <button id="wizard-next" class="primary">下一步</button>
          <button id="wizard-cancel" style="display:none">取消</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
