<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面宠物设置</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f5f6f8; color: #222; }
      h1 { font-size: 18px; }
      .pet-list { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
      .pet-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
      .pet-item.active { border-color: #4a90d9; background: #eef5fd; }
      button { padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      button.primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
      .actions { display: flex; gap: 8px; margin-left: auto; }
      .empty { color: #888; }
      #status { margin-top: 12px; font-size: 13px; color: #666; }
    </style>
  </head>
  <body>
    <h1>桌面宠物设置</h1>
    <div>
      <label>种类：
        <select id="species">
          <option value="cat">猫</option>
          <option value="dog">狗</option>
        </select>
      </label>
      <label>创建方式：
        <select id="mode">
          <option value="real_pet">真实宠物</option>
          <option value="adopted">直接领养</option>
        </select>
      </label>
      <button id="create" class="primary">新建宠物</button>
    </div>
    <div class="pet-list" id="list"></div>
    <div id="status"></div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
