<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宠物校准</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f5f6f8; color: #222; }
      h1 { font-size: 18px; }
      .row { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
      .row label { width: 140px; }
      .row input[type="range"] { flex: 1; }
      .row span.value { width: 48px; text-align: right; color: #666; }
      #preview { width: 200px; height: 200px; margin: 16px 0; border: 1px dashed #ccc; border-radius: 8px; background: #fff; }
      #status { font-size: 13px; color: #666; }
      button { padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      button.primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
    </style>
  </head>
  <body>
    <h1>宠物校准（实时预览）</h1>
    <div class="row">
      <label>呼吸幅度</label>
      <input type="range" id="breath" min="0" max="5" step="0.1" value="2" />
      <span class="value" id="breath-v">2%</span>
    </div>
    <div class="row">
      <label>眨眼间隔缩放</label>
      <input type="range" id="blink" min="0.5" max="2" step="0.1" value="1" />
      <span class="value" id="blink-v">1x</span>
    </div>
    <div class="row">
      <label>反馈强度</label>
      <input type="range" id="feedback" min="0" max="1" step="0.05" value="0.6" />
      <span class="value" id="feedback-v">0.6</span>
    </div>
    <div id="preview"></div>
    <div id="status"></div>
    <button id="save" class="primary">保存</button>
    <script type="module" src="/src/calibration.ts"></script>
  </body>
</html>
